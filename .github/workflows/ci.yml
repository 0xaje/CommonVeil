name: CI

on:
  push:
    branches: [main, post-audit-remediation]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run environment doctor & artifact manifest validation
        run: npm run doctor

      - name: Run full test suite (Node built-in test runner & tsx)
        run: npm test

      - name: Build production bundle & verify output
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f dist/index.html
          test -f dist/keys/attest.verifier
          test -f dist/keys/attest.prover
          test -f dist/zkir/attest.bzkir
          test -d dist/assets
